<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pikachu Landing Page</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="card">
        <!-- Background Watermark -->
        <svg class="watermark" viewBox="0 0 100 100" fill="currentColor">
            <path d="M50 10C27.9 10 10 27.9 10 50s17.9 40 40 40 40-17.9 40-40S72.1 10 50 10zm0 10c14.1 0 25.9 9.3 29.5 22H65c-2.4-5.8-8.2-10-15-10s-12.6 4.2-15 10H20.5C24.1 29.3 35.9 20 50 20zM20.5 58h14.5c2.4 5.8 8.2 10 15 10s12.6-4.2 15-10h14.5c-3.6 12.7-15.4 22-29.5 22S24.1 70.7 20.5 58zM50 42c4.4 0 8 3.6 8 8s-3.6 8-8 8-8-3.6-8-8 3.6-8 8-8z"/>
        </svg>

        <!-- Header -->
        <img src="pikachu.png" alt="Pokemon" class="logo">
        
        <div class="menu-icon">
            <svg width="30" height="20" viewBox="0 0 30 20" fill="none" xmlns="http://www.w3.org/2000/svg">
                <rect width="30" height="3" rx="1.5" fill="black"/>
                <rect y="8" width="30" height="3" rx="1.5" fill="black"/>
                <rect y="16" width="30" height="3" rx="1.5" fill="black"/>
            </svg>
        </div>

        <!-- Main Content -->
        <div class="content">
            <p class="subtitle">Pokemon Gen I</p>
            <h1>Pikachu</h1>
            <p class="description">
                Pikachu is an Electric-type Pokémon introduced in Generation I. 
                Pikachu are small, chubby, and incredibly cute mouse-like Pokémon. 
                They are almost completely covered by yellow fur.
            </p>
            <div class="pagination">01 / 08</div>
        </div>

        <!-- Pikachu Image -->
        <!-- Using a high-quality transparent PNG from an asset library -->
        <img src="pikachu.png" alt="Pikachu" class="pikachu-img">

        <!-- Navigation Dots -->
        <div class="side-nav">
            <div class="dot active"></div>
            <div class="dot"></div>
            <div class="dot"></div>
            <div class="dot"></div>
            <div class="dot"></div>
        </div>
    </div>

</body>
</html>
